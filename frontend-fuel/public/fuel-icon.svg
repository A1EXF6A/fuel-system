<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <style>
      .fuel-pump { fill: #2563eb; }
      .fuel-handle { fill: #1d4ed8; }
      .fuel-hose { fill: #64748b; stroke: #475569; stroke-width: 0.5; }
      .background { fill: #f8fafc; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" class="background" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Fuel pump base -->
  <rect x="6" y="12" width="10" height="12" rx="1" class="fuel-pump"/>
  
  <!-- Fuel pump top -->
  <rect x="7" y="8" width="8" height="5" rx="1" class="fuel-pump"/>
  
  <!-- Fuel handle -->
  <rect x="16" y="14" width="3" height="6" rx="1" class="fuel-handle"/>
  
  <!-- Fuel hose -->
  <path d="M19 17 Q22 17 24 19 Q26 21 25 24" class="fuel-hose" fill="none" stroke-width="1.5"/>
  
  <!-- Nozzle -->
  <circle cx="25" cy="24" r="1.5" class="fuel-handle"/>
  
  <!-- Display screen -->
  <rect x="8" y="9" width="6" height="3" rx="0.5" fill="#1e293b"/>
  <rect x="8.5" y="9.5" width="5" height="2" rx="0.3" fill="#22c55e"/>
  
  <!-- Fuel drop icon -->
  <path d="M11 20 Q11 18 10 18 Q9 18 9 20 Q9 22 10 22 Q11 22 11 20" fill="#3b82f6"/>
</svg>