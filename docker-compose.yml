version: "3.9"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - fuel-net

  authservice:
    build:
      context: ./XYZ.AuthService
      dockerfile: Dockerfile
    container_name: authservice
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=XYZ_AuthDB;User Id=sa;Password=Your_password123;TrustServerCertificate=true;
    ports:
      - "5000:5000"
    networks:
      - fuel-net

  driversservice:
    build:
      context: ./XYZ.DriversService
      dockerfile: Dockerfile
    container_name: driversservice
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=XYZ_DriversDB;User Id=sa;Password=Your_password123;TrustServerCertificate=true;
    ports:
      - "5002:80"
    networks:
      - fuel-net

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuel-net

  vehiclesservice:
    build: ./XYZ.VehiclesService
    container_name: vehiclesservice
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=XYZ_VehiclesDB;Username=postgres;Password=postgres
    ports:
      - "5003:5002"
    networks:
      - fuel-net


networks:
  fuel-net:
    driver: bridge
